# Release: builds the macOS disk image with tools/package.sh, which also checks it, on every v*
# tag and by hand (CLAUDE.md, **Release notes**; docs/reference/testing-tools.md, **Release**).
# On a tag the image goes to a draft GitHub release named for the tag, whose body is
# tools/changelog.sh's section for the version; run by hand on a branch, the image is kept as
# the run's artifact instead. Unsigned. The tools and vcpkg are set up as in ci.yml.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and the tags, for tools/changelog.sh.
          fetch-depth: 0

      - name: Install the tools
        run: brew install ninja llvm clang-format stockfish qt

      - name: Set up vcpkg at the baseline
        run: |
          baseline="$(jq -r '."default-registry".baseline' vcpkg-configuration.json)"
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Package
        run: tools/package.sh

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg=(build/release/chess-coach-*.dmg)
          case "${dmg[0]}" in
            "build/release/chess-coach-$version-macos-"*.dmg) ;;
            *) echo "${dmg[0]} is not version $version: set project(VERSION) to it" >&2
               exit 1 ;;
          esac
          tools/changelog.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "${dmg[0]}" --draft --verify-tag \
            --title "chess-coach $version" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Keep the image
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: chess-coach-macos
          path: build/release/chess-coach-*.dmg
