# CI: the full gate (tools/gates.sh) on macOS and Ubuntu on every push to main and every pull
# request (PLAN.md §9; docs/reference/testing-tools.md, **CI**). Qt comes from Homebrew and apt,
# never from vcpkg; vcpkg is cloned at the baseline vcpkg-configuration.json pins, and its binary
# cache is kept in the Actions cache, keyed by the manifest, the configuration and the overlay
# ports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja llvm clang-format stockfish qt

      - name: Install the tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # clang-format and clang-tidy come from apt.llvm.org at the same major version as
          # Homebrew's llvm on macOS and on the dev machine (docs/reference/testing-tools.md,
          # **CI**), so the two jobs and the local gate format and lint identically; Ubuntu's own
          # packages are a major behind. The compiler stays GCC.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-23 clang-tidy-23 qt6-base-dev \
            qt6-svg-dev libgl1-mesa-dev stockfish
          for tool in clang-format clang-tidy run-clang-tidy; do
            sudo ln -sf "/usr/bin/$tool-23" "/usr/local/bin/$tool"
          done
          # apt installs stockfish under /usr/games.
          echo /usr/games >> "$GITHUB_PATH"

      - name: Set up vcpkg at the baseline
        run: |
          baseline="$(jq -r '."default-registry".baseline' vcpkg-configuration.json)"
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Gate
        run: tools/gates.sh

      - name: Upload the failing tests' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-failures-${{ matrix.os }}
          path: build/gate-failures
          if-no-files-found: ignore
