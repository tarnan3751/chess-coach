# CI: the full gate (tools/gates.sh) on macOS and Ubuntu on every push to main and every pull
# request (PLAN.md §9; docs/reference/testing-tools.md, **CI**). Qt comes from Homebrew and apt,
# never from vcpkg; vcpkg is cloned at the baseline vcpkg-configuration.json pins, and its binary
# cache is kept in the Actions cache, keyed by the manifest, the configuration and the overlay
# ports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja llvm clang-format stockfish qt

      - name: Install the tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # clang-format and clang-tidy come from the PyPI wheels at the same major version as
          # Homebrew's llvm on macOS and on the dev machine (docs/reference/testing-tools.md,
          # **CI**), so the two jobs and the local gate format and lint identically; Ubuntu's own
          # packages are a major behind, and apt.llvm.org failed to resolve on the runners twice.
          # Ubuntu's clang-tools supplies only run-clang-tidy, the driver script; the gate tells
          # it which clang-tidy to run, since the versioned script defaults to clang-tidy-18.
          # The compiler stays GCC.
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tools qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev stockfish
          python3 -m pip install --user --break-system-packages \
            clang-format==23.1.3 clang-tidy==23.1.4
          for tool in clang-format clang-tidy; do
            sudo ln -sf "$HOME/.local/bin/$tool" "/usr/local/bin/$tool"
          done
          sudo ln -sf "$(ls /usr/bin/run-clang-tidy-* | sort -V | tail -1)" /usr/local/bin/run-clang-tidy
          clang-format --version && clang-tidy --version | head -2 && run-clang-tidy -h | head -1
          # apt installs stockfish under /usr/games.
          echo /usr/games >> "$GITHUB_PATH"

      - name: Set up vcpkg at the baseline
        run: |
          baseline="$(jq -r '."default-registry".baseline' vcpkg-configuration.json)"
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Gate
        run: tools/gates.sh

      - name: Upload the failing tests' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-failures-${{ matrix.os }}
          path: build/gate-failures
          if-no-files-found: ignore
